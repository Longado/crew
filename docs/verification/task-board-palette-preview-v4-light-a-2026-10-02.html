<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crew · 配色预览 v4 · 浅色 A · 暖纸墨蓝</title><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<style>/* A: warm paper and navy; status colors remain semantic. */
:root {
  color-scheme: light;
  --ink: #242B32;
  --muted-surface: #64707A;
  --muted: var(--muted-surface);
  --muted-on-bg: #626E78;
  --muted-on-tint: #586570;
  --faint: #5E6A74;
  --line: #DEDAD2;
  --line-soft: #E8E3DA;
  --bg: #F4F1EA;
  --surface: #FFFCF6;
  --soft: #EEE9E0;
  --accent: #31566F;
  --accent-strong: #234154;
  --selected: #E4EBEF;
  --accent-line: #B3C3CD;
  --accent-hover: #D7E2E8;
  --button: #31566F;
  --button-hover: #234154;
  --button-text: #FFFFFF;
  --connected: #3B6C50;
  --blue: #46677F;
  --amber: #825E2F;
  --amber-soft: #F4E8D1;
  --amber-line: #D4BC94;
  --danger: #994A37;
  --focus: #31566F;
  --focus-ring: #31566F1C;
  --scroll: #B6BFC4;
  --drag-shadow: #242B3226;
  --dialog-shadow: #242B3224;
  --backdrop: #242B3266;
  --button-inset: #242B3220;
  --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; }
button, a { touch-action: manipulation; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
button, a, input, textarea, summary { transition: color .15s, background-color .15s, border-color .15s, box-shadow .15s; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.ui-icon { display: inline-block; flex: 0 0 auto; width: 16px; height: 16px; color: currentColor; vertical-align: middle; }

/* One quiet frame, with a task list and a wider reading pane. */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 44px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--bg); }
.brand { display: inline-flex; align-items: center; flex: 0 0 auto; font-size: 18px; line-height: 1.3; font-weight: 600; letter-spacing: -.3px; }
.brand:hover { text-decoration: none; }
.connection { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.connection i { width: 6px; height: 6px; flex: 0 0 auto; border-radius: 50%; background: var(--connected); }
.connection.disconnected { color: var(--amber); }
.connection.disconnected i { background: var(--amber); }
.connection a { display: inline-flex; align-items: center; gap: 4px; margin-left: 10px; color: var(--muted); font-size: 11.5px; }
.connection a .ui-icon { width: 13px; height: 13px; }
.connection a:hover { color: var(--ink); }
.workspace { display: flex; flex-direction: column; height: calc(100dvh - 44px); min-height: 0; max-width: 100%; margin: 0; padding: 0; }
.workspace-body { display: grid; grid-template-columns: minmax(320px, 46fr) minmax(340px, 54fr); flex: 1 1 auto; gap: 0; min-height: 0; }
.task-panel, .execution { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.top, .task-panel { --muted: var(--muted-on-bg); }
.task-panel { background: var(--bg); }
.execution { border-left: 1px solid var(--line); background: var(--surface); }
.controls { display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; gap: 16px; min-height: 68px; padding: 16px 24px; }
.heading { display: flex; align-items: baseline; min-width: 0; }
h1 { margin: 0; color: var(--ink); font-size: 20px; line-height: 1.4; font-weight: 600; letter-spacing: -.4px; white-space: nowrap; }
.search { display: flex; align-items: center; gap: 8px; width: 270px; max-width: 64%; min-width: 0; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--muted); transition: border-color .15s, box-shadow .15s; }
.search .ui-icon { width: 16px; height: 16px; }
.search input { width: 100%; min-width: 0; padding: 0; border: 0; outline: none; color: var(--ink); background: transparent; font-size: 12.5px; }
.search:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px var(--focus-ring); }
.search input::placeholder { color: var(--faint); }
.search input:focus-visible { outline: none; }
.list-toolbar { display: flex; align-items: center; flex: 0 0 auto; min-height: 40px; margin: 0 24px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; align-items: center; gap: 22px; min-width: 0; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; gap: 6px; padding: 8px 1px 11px; border: 0; background: transparent; color: var(--muted); font-size: 12.5px; line-height: 1.5; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); font-weight: 600; }
.tab.active::after { position: absolute; right: 0; bottom: 0; left: 0; height: 2px; background: var(--accent); content: ''; }
.filter-count { color: var(--muted); font-size: 11.5px; line-height: 1.5; font-weight: 400; font-variant-numeric: tabular-nums; }
.tab.active .filter-count { color: var(--ink); }
.task-scroll { min-height: 0; flex: 1 1 auto; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
.task-group { padding: 0 20px 14px; }
.lane-head { display: flex; align-items: center; min-height: 38px; padding: 12px 1px 8px; }
.lane-head h2 { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; font-weight: 500; }
.cards { display: flex; flex-direction: column; gap: 0; overflow: hidden; border: 1px solid var(--line-soft); border-radius: 7px; background: var(--surface); }
.cards:empty { display: none; }
#task-panel[data-view=agent] #ready-group, #task-panel[data-view=human] #waiting-group { padding-top: 16px; }
#task-panel[data-view=agent] #ready-group .lane-head, #task-panel[data-view=human] #waiting-group .lane-head { display: none; }
#task-panel[data-view=done] .archive { padding-top: 16px; }
#task-panel[data-view=done] .archive > summary { display: none; }
#task-panel[data-view=done] .archive .cards { margin-top: 0; }

/* Two lines per task. Selection does not change row size or position. */
.card { --muted: var(--muted-surface); position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 18px; min-height: 64px; padding: 10px 14px 9px; border: 0; border-bottom: 1px solid var(--line-soft); background: var(--surface); cursor: pointer; transition: background-color .15s, opacity .15s; }
.card:last-child { border-bottom: 0; }
.card:hover { --muted: var(--muted-on-tint); background: var(--soft); }
.card.selected { --muted: var(--muted-on-tint); background: var(--selected); }
.card.selected::before { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; background: var(--accent); content: ''; }
.card:focus-visible { --muted: var(--muted-on-tint); outline-offset: -2px; background: var(--selected); }
.card[data-draggable=true] { cursor: grab; user-select: none; touch-action: pan-y; }
.card[data-draggable=true]:active { cursor: grabbing; }
.card.dragging { opacity: .4; }
.task-main { min-width: 0; }
.card h3 { overflow: hidden; margin: 0; color: var(--ink); font-size: 14px; line-height: 1.4; font-weight: 600; letter-spacing: -.1px; text-overflow: ellipsis; white-space: nowrap; }
.card .next { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden; margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
.task-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 44px; }
.status-badge { display: inline-flex; align-items: center; color: var(--muted); font-size: 12px; line-height: 1.5; font-weight: 400; white-space: nowrap; }
.status-badge.doing { color: var(--blue); }
.status-badge.blocked, .status-badge.waiting { color: var(--amber); }
.status-badge.cancelled { color: var(--faint); }
.task-actions button { min-height: 28px; padding: 3px 7px; border: 0; border-radius: 4px; background: transparent; color: var(--accent); font-size: 12px; line-height: 1.5; font-weight: 400; white-space: nowrap; }
.task-actions button:not(:disabled):hover { background: var(--selected); color: var(--accent-strong); }
.card.selected .task-actions button:not(:disabled):hover { background: var(--accent-hover); }
.task-actions button:disabled { color: var(--faint); opacity: .65; }
.archive { padding: 8px 21px 18px; }
.archive summary { display: list-item; cursor: pointer; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.archive summary:hover { color: var(--ink); }
.archive .cards { margin-top: 10px; }
.archive .card h3 { color: var(--muted); }
.archive .card.selected h3 { color: var(--ink); }
.empty { padding: 20px 24px; color: var(--muted); font-size: 13px; }

/* The small drop target and tabs stay fixed above the scrolling content. */
.dock-head { display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; gap: 16px; min-height: 68px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.dock-tabs { display: flex; align-self: stretch; align-items: stretch; flex: 0 1 auto; gap: 24px; min-width: 0; }
.dock-tabs button { position: relative; display: inline-flex; align-items: center; flex: 0 0 auto; gap: 6px; padding: 0 1px; border: 0; background: transparent; color: var(--muted); font-size: 13px; line-height: 1.5; white-space: nowrap; }
.dock-tabs button:hover { color: var(--ink); }
.dock-tabs button.active { color: var(--ink); font-weight: 600; }
.dock-tabs button.active::after { position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; background: var(--accent); content: ''; }
#run-state { display: none; color: var(--muted); font-size: 11.5px; line-height: 1.5; white-space: nowrap; }
#run-state.busy { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); }
#run-state.busy::before { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); content: ''; }
.dropzone { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; gap: 7px; min-width: 106px; height: 32px; padding: 0 12px; border: 1px dashed var(--line); border-radius: 5px; background: transparent; color: var(--muted); font-size: 12px; line-height: 1.4; white-space: nowrap; transition: background-color .15s, border-color .15s, box-shadow .15s, opacity .15s; }
.dropzone .ui-icon { width: 16px; height: 16px; }
.dropzone:hover { border-color: var(--accent-line); background: var(--soft); color: var(--ink); }
.dropzone.over { border-color: var(--accent); background: var(--selected); color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
.dropzone.busy { opacity: .6; }
.dock-content { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; overflow: hidden; padding: 0; }
#inspector { display: flex; flex-direction: column; flex: 1 1 auto; height: 100%; min-width: 0; min-height: 0; }
.detail-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 28px 28px 24px; overscroll-behavior: contain; scrollbar-gutter: stable; }
.detail-title { display: flex; align-items: baseline; gap: 18px; margin-bottom: 28px; }
.detail-title h2 { min-width: 0; margin: 0; color: var(--ink); font-size: 22px; line-height: 1.4; font-weight: 600; letter-spacing: -.4px; overflow-wrap: anywhere; }
.detail-title .status-badge { flex: 0 0 auto; font-size: 12px; }
.detail-row { margin-top: 24px; padding: 0; border: 0; }
.detail-title + .detail-row { margin-top: 0; }
.detail-row strong { display: block; margin-bottom: 8px; color: var(--muted); font-size: 12px; line-height: 1.5; font-weight: 500; }
.detail-row p { margin: 0; color: var(--ink); font-size: 14px; line-height: 1.75; overflow-wrap: anywhere; }
.task-context { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 12.5px; line-height: 1.6; }
.task-context summary { cursor: pointer; font-weight: 500; }
.task-context summary:hover { color: var(--ink); }
.task-context p { margin: 12px 0; color: var(--muted); font-size: 13px; line-height: 1.75; }
.inspector-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; color: var(--faint); font-size: 11.5px; line-height: 1.6; }
.inspector-meta > span { min-width: 0; overflow-wrap: anywhere; }
.entry { overflow-wrap: anywhere; color: var(--muted); font: 11.5px/1.75 ui-monospace, SFMono-Regular, Menlo, monospace; }
.detail-actions { display: flex; align-items: center; flex: 0 0 auto; flex-wrap: wrap; gap: 12px; margin: 0 28px; padding: 16px 0 22px; border-top: 1px solid var(--line); background: var(--surface); }
.action-mode { flex: 1 1 150px; margin-right: auto; color: var(--muted); font-size: 12px; line-height: 1.5; }
.detail-actions .primary { min-width: 112px; min-height: 34px; padding: 6px 16px; }
.detail-actions .primary:disabled { cursor: default; }
.inspector-empty { padding: 30px 28px; color: var(--muted); font-size: 14px; line-height: 1.7; }
.inspector-empty > span { display: block; margin-top: 8px; color: var(--faint); font-size: 12.5px; line-height: 1.7; }

/* Current work remains explicit; completed receipts use a quiet disclosure. */
.jobs { display: grid; align-content: start; flex: 1 1 auto; gap: 12px; min-width: 0; min-height: 0; overflow: auto; padding: 22px 24px; overscroll-behavior: contain; scrollbar-gutter: stable; }
.job { min-width: 0; padding: 16px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
.job-heading { min-width: 0; }
.job-title { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
.job h3 { min-width: 0; margin: 0; color: var(--ink); font-size: 14px; line-height: 1.5; font-weight: 600; overflow-wrap: anywhere; }
.job-title .status-badge { flex: 0 0 auto; }
.job-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 6px; color: var(--muted); font-size: 11.5px; line-height: 1.5; }
.job .label { margin: 12px 0 0; color: var(--accent); font-size: 12px; line-height: 1.6; }
.job.blocked .label { color: var(--amber); }
.job-history { margin-top: 14px; padding-top: 11px; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 12px; line-height: 1.6; }
.job-history > summary { cursor: pointer; }
.job-history > summary:hover { color: var(--ink); }
.members { --muted: var(--muted-on-tint); color: var(--muted); display: flex; flex-direction: column; gap: 8px; margin: 12px 0; padding: 10px 12px; border-radius: 5px; background: var(--soft); font-size: 11.5px; line-height: 1.6; }
.member { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-width: 0; }
.member > :first-child { overflow-wrap: anywhere; }
.member > :last-child { flex: 0 0 auto; color: var(--muted); text-align: right; }
.job-links { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px; color: var(--accent); font-size: 12px; line-height: 1.6; }
.job-links button { padding: 0; border: 0; background: transparent; color: var(--amber); font: inherit; }
.job-links button:hover { color: var(--danger); }
.job details:not(.job-history) { margin-top: 12px; color: var(--muted); font-size: 12px; }
.job details:not(.job-history) > summary { cursor: pointer; }
.output { max-height: 250px; overflow: auto; margin: 10px 0 0; padding: 12px; border-radius: 5px; background: var(--soft); color: var(--ink); font: 12px/1.75 var(--sans); white-space: pre-wrap; overflow-wrap: anywhere; }
.muted { margin: 6px 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
.error { margin: 10px 0 0; color: var(--danger); font-size: 12px; line-height: 1.65; }
.error:empty { display: none; }

footer { display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; gap: 12px; min-height: 28px; padding: 5px 24px; border-top: 1px solid var(--line-soft); color: var(--faint); font-size: 10.5px; line-height: 1.5; }
footer > span:last-child { margin-left: auto; white-space: nowrap; }
#notice:empty { display: none; }
#notice:not(:empty) { flex: 0 0 auto; padding: 9px 24px; border-bottom: 1px solid var(--amber-line); background: var(--amber-soft); color: var(--amber); font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
.drag-ghost { position: fixed; z-index: 1000; max-width: 240px; padding: 8px 14px; pointer-events: none; border: 1px solid var(--button-hover); border-radius: 6px; background: var(--button); color: var(--button-text); box-shadow: 0 6px 22px var(--drag-shadow); font: 12.5px/1.5 var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Requirements are readable before the unchanged editable execution payload. */
dialog { width: calc(100% - 28px); max-width: 620px; max-height: calc(100dvh - 24px); overflow: auto; padding: 24px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); box-shadow: 0 16px 60px var(--dialog-shadow); }
dialog::backdrop { background: var(--backdrop); backdrop-filter: blur(3px); }
dialog h2 { margin: 7px 28px 8px 0; font-size: 20px; line-height: 1.4; font-weight: 600; letter-spacing: -.4px; overflow-wrap: anywhere; }
.eyebrow { color: var(--muted); font-size: 12px; line-height: 1.5; font-weight: 500; }
.close { position: absolute; top: 13px; right: 14px; display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: 23px; line-height: 1; }
.close:hover { background: var(--soft); color: var(--ink); }
.launch-summary { --muted: var(--muted-on-tint); margin-top: 16px; padding: 14px 16px; border: 1px solid var(--line-soft); border-radius: 7px; background: var(--soft); }
.launch-summary .detail-row { margin-top: 14px; }
.launch-summary > .detail-row:first-child { margin-top: 0; }
.launch-summary .detail-row strong { margin-bottom: 5px; font-size: 11.5px; }
.launch-summary .detail-row p { font-size: 13px; line-height: 1.7; }
.modes { display: flex; gap: 10px; margin: 18px 0; }
.modes label { display: grid; grid-template-columns: 16px minmax(0, 1fr); align-items: center; flex: 1; gap: 0 8px; min-width: 0; padding: 11px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); cursor: pointer; font-size: 12px; transition: background-color .15s, border-color .15s; }
.modes label:hover { border-color: var(--accent-line); }
.modes label:has(input:checked) { --muted: var(--muted-on-tint); border-color: var(--accent-line); background: var(--selected); }
.modes label:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.modes input { margin: 0; accent-color: var(--accent); }
.modes input:focus-visible { outline: none; }
.modes strong { font-weight: 600; }
.modes span { grid-column: 2; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.5; }
.modes label:has(input:disabled) { opacity: .45; cursor: default; }
.advanced-instructions { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 12px; line-height: 1.6; }
.advanced-instructions > summary { cursor: pointer; }
.advanced-instructions > summary:hover { color: var(--ink); }
.field { display: block; margin-top: 12px; color: var(--ink); font-size: 12px; font-weight: 500; }
textarea { display: block; width: 100%; min-height: 96px; max-height: 220px; margin-top: 7px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); color: var(--ink); font-size: 12px; line-height: 1.65; resize: vertical; }
textarea:focus-visible { border-color: var(--focus); outline-offset: 1px; box-shadow: 0 0 0 3px var(--focus-ring); background: var(--surface); }
.path { margin-top: 12px; color: var(--muted); font: 11px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.primary, .secondary { min-height: 34px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 5px; font-size: 12.5px; line-height: 1.5; font-weight: 500; }
.primary { border-color: var(--button); background: var(--button); color: var(--button-text); }
.primary:not(:disabled):hover { border-color: var(--button-hover); background: var(--button-hover); }
.primary:active { box-shadow: inset 0 1px 2px var(--button-inset); }
.secondary { background: var(--surface); color: var(--muted); }
.secondary:hover { background: var(--soft); color: var(--ink); }
.primary:disabled { opacity: .5; cursor: wait; }

.task-scroll, .detail-body, .jobs, .output, dialog { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
.task-scroll::-webkit-scrollbar, .detail-body::-webkit-scrollbar, .jobs::-webkit-scrollbar, .output::-webkit-scrollbar, dialog::-webkit-scrollbar { width: 7px; height: 7px; }
.task-scroll::-webkit-scrollbar-track, .detail-body::-webkit-scrollbar-track, .jobs::-webkit-scrollbar-track, .output::-webkit-scrollbar-track, dialog::-webkit-scrollbar-track { background: transparent; }
.task-scroll::-webkit-scrollbar-thumb, .detail-body::-webkit-scrollbar-thumb, .jobs::-webkit-scrollbar-thumb, .output::-webkit-scrollbar-thumb, dialog::-webkit-scrollbar-thumb { min-height: 26px; border: 2px solid var(--surface); border-radius: 8px; background: var(--scroll); }
.task-scroll::-webkit-scrollbar-thumb:hover, .detail-body::-webkit-scrollbar-thumb:hover, .jobs::-webkit-scrollbar-thumb:hover, .output::-webkit-scrollbar-thumb:hover, dialog::-webkit-scrollbar-thumb:hover { background: var(--faint); }

@media (max-width: 1000px) {
  .top { padding-right: 20px; padding-left: 20px; }

  if (filter==='done' || (query&&!ready.length&&!waiting.length&&!active.length&&ended.length)) $('archive').open = true;
  $('empty-list').hidden = Boolean(tasks.length);
  [['all-count',data.tasks.length],['agent-count',data.tasks.filter(t=>t.eligible).length],['human-count',data.tasks.filter(t=>!t.eligible&&!['done','cancelled','doing'].includes(t.status)).length],['ended-count',data.tasks.filter(t=>['done','cancelled'].includes(t.status)).length]].forEach(([id,count])=>$(id).textContent=count);
  html('inspector',inspector(data.tasks.find(t=>t.task_id===inspectedId)));
  const opened = [...document.querySelectorAll('.job details[open]')].map(e=>e.dataset.job);
  html('jobs', [...data.jobs].reverse().map(job => {
    const snap = job.snapshot || {}, leader = (snap.agents||[]).find(a=>!a.parentThreadId), native = snap.nativeTasks||[];
    const live = ['starting','running','waiting'].includes(job.state);
    const heading = `<div class="job-heading"><div class="job-title"><h3>${esc(job.title)}</h3><span class="status-badge ${esc(job.state)}">${esc(labels[job.state] || job.state)}</span></div><div class="job-meta"><time datetime="${esc(job.created_at)}">${esc(job.created_at.slice(11,16))}</time><span>${job.access==='read-only'?'只读':'隔离修改'}</span></div></div>`;
    const context = `<p class="label">${esc(job.label)}</p>${snap.agents?.length?'<div class="members">'+snap.agents.map(a=>`<div class="member"><span>${esc(a.name)}</span><span>${esc(labels[a.state]||a.state)}</span></div>`).join('')+'</div>':''}${native.length?'<div class="muted">负责人已验收 '+native.filter(t=>t.state==='accepted').length+' / '+native.length+' 项</div>':''}`;
    const error = snap.error?'<p class="error">'+esc(snap.error)+'</p>':'';
    const links = `<div class="job-links"><a href="${esc(job.crew_link)}" target="_blank" rel="noopener">Crew 工作台 ↗</a><a href="/api/receipt/${job.id}" target="_blank" rel="noopener">运行回执 ↗</a>${live?'<button data-stop="'+job.id+'">停止运行</button>':''}</div>`;
    return `<article class="job ${job.state==='blocked'?'blocked':''}">${heading}${error}${!live&&job.state!=='blocked'?`<details class="job-history" data-job="${job.id}" ${opened.includes(job.id)?'open':''}><summary>背景与回执</summary><div class="job-meta">任务 #${job.task_id}</div>${context}${leader?.output?`<div class="output">${esc(leader.output)}</div>`:''}${links}</details>`:`${context}${leader?.output?`<details data-job="${job.id}" ${opened.includes(job.id)?'open':''}><summary>查看执行结果</summary><div class="output">${esc(leader.output)}</div></details>`:''}${links}`}</article>`;
  }).join('') || '<div class="inspector-empty">还没有运行记录。<span>启动任务后，成员进度与结果会出现在这里。</span></div>');
  const busy = isBusy();
  $('dropzone').classList.toggle('busy',busy);
  $('dropzone').setAttribute('aria-disabled',String(busy));
  const current = data.jobs.find(j=>['starting','running','waiting'].includes(j.state));
  $('run-state').textContent = current ? (current.state==='starting'?'启动中':current.state==='waiting'?'等待处理':'运行中') : '待命';
  $('run-state').classList.toggle('busy',busy);
  $('run-count').textContent = data.jobs.length;
  setDockView(dockView);
  $('crew-link').href = data.crew_url || '#';
  $('synced').textContent = '示例预览 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}
function detail(task) {
  if (!task) return;
  inspectedId = task.task_id; setDockView('detail'); render();
}
function checkGoal() {
  return '只读核对清单.json和README.md，不执行其他项目任务。\n创建恰好两位原生成员，先crew_plan_tasks记录两项任务，spawn_agent后用返回的成员名称或真实线程ID调用crew_assign_task绑定。\n成员A仅负责清单.json：核对sources恰好覆盖1到20、无重复，18条唯一task_id，8/17和15/16合并，沿用190/215/216。\n成员B仅负责README.md：核对18行、20个来源编号、状态与JSON一致；区分昨日阶段完成与当前下一步，保留化学取消、LLM主实验暂停，拟执行不代表已派发。\n两位成员只读、引用实际文件、不得递归委派；你读取指定文件复核成员结果，随后调用crew_review_task分别接受或指出缺口。最终给出真实成员、绑定和验收结果。\n只读取上述两个文件，不读取数据库、客户材料或其他目录；不得写文件、联网或申请扩大权限。';
}
function launch(task) {
  if (!task?.eligible) { if(task)detail(task); return; }
  if (isBusy()) { $('notice').textContent='已有任务运行中，请在运行记录查看进度，结束后再启动。'; return; }
  selected = task;
  $('launch-title').textContent = task.line;
  $('launch-next').textContent = task.next;
  $('launch-acceptance').textContent = task.acceptance;
  $('launch-instructions').open = false;
  $('goal').value = task.check_only ? checkGoal() : `任务 #${task.task_id}：${task.title}\n本次目标：${task.next}\n交付条件：${task.acceptance}\n入口：${task.entry || task.cwd}\n只读模式先核对本地现状，引用实际文件，给出完成项、缺口和可执行的下一步；隔离修改模式只实现上述本地范围并完成适当检查。需要本人操作的验收保留给本人。`;
  document.querySelector('input[value="read-only"]').checked=true;
  document.querySelector('input[value="workspace-write"]').disabled=task.check_only;
  $('launch-path').textContent = '执行目录：'+task.cwd+' · 本次执行器：Codex 团队';
  $('launch-error').textContent='';
  $('start').disabled=false;
  $('launch').showModal();
}
async function post(path, payload) {
  const res = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','x-corpus':'1'},body:JSON.stringify(payload)});
  const result = await res.json(); if(!res.ok)throw new Error(result.error||'操作未完成'); return result;
}
async function refresh() {
  try {
    const res=await fetch('/api/board'); if(!res.ok)throw new Error(); data=await res.json();
    $('connection-text').textContent='演示数据'; $('connection').classList.remove('disconnected');
    if ($('notice').textContent==='暂时无法连接任务看板，恢复后会继续同步。') $('notice').textContent='';
    if (inspectedId===null) inspectedId=(data.tasks.find(t=>t.eligible)||data.tasks[0])?.task_id ?? null;
    if(!dragging)render();
  }
  catch { $('connection-text').textContent='连接中断'; $('connection').classList.add('disconnected'); $('synced').textContent='连接中断'; $('notice').textContent='暂时无法连接任务看板，恢复后会继续同步。'; }
}
document.addEventListener('click',event=>{
  if (Date.now() < suppressClickUntil) return;
  const filterButton=event.target.closest('[data-filter]');
  if (filterButton) { filter=filterButton.dataset.filter; document.querySelectorAll('.tab').forEach(tab=>{const active=tab===filterButton;tab.classList.toggle('active',active);tab.setAttribute('aria-pressed',String(active));}); render(); return; }
  const dockButton=event.target.closest('[data-dock-view]'); if(dockButton){setDockView(dockButton.dataset.dockView);return;}
  const action=event.target.closest('[data-action]');
  if(action) { const task=data.tasks.find(t=>t.task_id===Number(action.closest('.card').dataset.id)); action.dataset.action==='launch'?launch(task):detail(task); return; }
  const cardEl=event.target.closest('.card');
  if(cardEl) { detail(data.tasks.find(t=>t.task_id===Number(cardEl.dataset.id))); return; }
  const closer=event.target.closest('[data-close]'); if(closer)$(closer.dataset.close).close();
  const taskLaunch=event.target.closest('[data-detail-launch]'); if(taskLaunch){launch(data.tasks.find(t=>t.task_id===Number(taskLaunch.dataset.detailLaunch)));}
  const stop=event.target.closest('[data-stop]'); if(stop){stop.disabled=true;post('/api/stop',{job_id:stop.dataset.stop}).then(refresh).catch(e=>{$('notice').textContent=e.message;stop.disabled=false;});}
});
document.addEventListener('keydown',event=>{
  if (!['Enter',' '].includes(event.key) || event.target.closest('button,a,input,textarea')) return;
  const cardEl=event.target.closest('.card'); if(cardEl){event.preventDefault();detail(data.tasks.find(t=>t.task_id===Number(cardEl.dataset.id)));}
});
document.addEventListener('pointerdown', event => {
  if (event.pointerType==='touch' || event.button !== 0 || event.target.closest('button,a')) return;
  const cardEl = event.target.closest('.card[data-draggable="true"]');
  if (!cardEl) return;
  gesture = {card:cardEl, id:event.pointerId, x:event.clientX, y:event.clientY, started:false, ghost:null};
  cardEl.setPointerCapture(event.pointerId);
});
function insideDrop(x,y) { const r=$('dropzone').getBoundingClientRect(); return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom; }
document.addEventListener('pointermove', event => {
  if (!gesture || gesture.id !== event.pointerId) return;
  if (!gesture.started && Math.hypot(event.clientX-gesture.x,event.clientY-gesture.y)<8) return;
  event.preventDefault();
  if (!gesture.started) {
    gesture.started=true; dragging=true; gesture.card.classList.add('dragging');
    gesture.ghost=document.createElement('div'); gesture.ghost.className='drag-ghost';
    gesture.ghost.textContent=data.tasks.find(t=>t.task_id===Number(gesture.card.dataset.id)).line;
    document.body.appendChild(gesture.ghost);
  }
  gesture.ghost.style.left=(event.clientX+14)+'px'; gesture.ghost.style.top=(event.clientY+14)+'px';
  $('dropzone').classList.toggle('over',insideDrop(event.clientX,event.clientY));
});
function finishGesture(event,cancelled=false) {
  if (!gesture || gesture.id !== event.pointerId) return;
  const current=gesture; gesture=null; dragging=false;
  current.card.classList.remove('dragging'); current.ghost?.remove(); $('dropzone').classList.remove('over');
  if (current.started) { suppressClickUntil=Date.now()+200; if(!cancelled&&insideDrop(event.clientX,event.clientY))launch(data.tasks.find(t=>t.task_id===Number(current.card.dataset.id))); }
}
document.addEventListener('pointerup',event=>finishGesture(event));
document.addEventListener('pointercancel',event=>finishGesture(event,true));
$('launch-form').addEventListener('submit',async event=>{
  event.preventDefault(); if(launching)return; launching=true; $('start').disabled=true; $('launch-error').textContent='';
  try { await post('/api/dispatch',{task_id:selected.task_id,access:new FormData(event.target).get('access'),goal:$('goal').value}); $('launch').close();$('notice').textContent='';setDockView('runs');await refresh(); }
  catch(error){$('launch-error').textContent=error.message;}
  finally{launching=false;$('start').disabled=false;}
});
$('goal').addEventListener('invalid',()=>{ $('launch-instructions').open=true; });
document.addEventListener('dragstart',event=>{
  const cardEl=event.target.closest('.card[draggable=true]'); if(!cardEl)return;
  dragging=true;event.dataTransfer.setData('text/plain',cardEl.dataset.id);event.dataTransfer.effectAllowed='move';cardEl.classList.add('dragging');
});
document.addEventListener('dragend',()=>{dragging=false;document.querySelectorAll('.dragging').forEach(e=>e.classList.remove('dragging'));$('dropzone').classList.remove('over');});
$('dropzone').addEventListener('dragover',event=>{event.preventDefault();event.dataTransfer.dropEffect='move';$('dropzone').classList.add('over');});
$('dropzone').addEventListener('dragleave',event=>{if(!$('dropzone').contains(event.relatedTarget))$('dropzone').classList.remove('over');});
$('dropzone').addEventListener('drop',event=>{event.preventDefault();dragging=false;$('dropzone').classList.remove('over');launch(data.tasks.find(t=>t.task_id===Number(event.dataTransfer.getData('text/plain'))));});
$('search').addEventListener('input',render);
refresh();setInterval(refresh,3000);
</script>
</body>
</html>
